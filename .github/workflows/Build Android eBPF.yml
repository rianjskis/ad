name: Build Android eBPF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Setup Go
        uses: actions/setup-go@main
        with:
          go-version: '1.26.8'
          cache: false

      - name: Git clone
        run: |
          git clone -b ebpf-inbound --single-branch https://github.com/CHIZI-0618/sing-box

      - name: Clone cronet-go
        run: |
          git clone --recursive --depth=1 https://github.com/SagerNet/cronet-go.git

      - name: Prepare cronet-go toolchain (linux arm64 musl)
        run: |
          set -euo pipefail
          cd cronet-go

          go run ./cmd/build-naive \
            --target=linux/arm64 \
            --libc=musl \
            download-toolchain

          go run ./cmd/build-naive \
            --target=linux/arm64 \
            --libc=musl \
            env >> "$GITHUB_ENV"

      - name: Build sing-box (linux arm64 musl naive)
        run: |
          set -euo pipefail
          cd sing-box

          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=arm64

          TAGS="with_quic with_utls with_clash_api with_naive_outbound with_musl badlinkname tfogo_checklinkname0"

          go build -v -trimpath \
            -tags "$TAGS" \
            -ldflags "-checklinkname=0 -X 'internal/godebug.defaultGODEBUG=multipathtcp=0' -s -w -buildid=" \
            -o sing-box-linux-arm64-musl \
            ./cmd/sing-box

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build sing-box (android arm64)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TAGS: with_quic with_ebpf with_utls with_clash_api badlinkname tfogo_checklinkname0
        run: |
          cd sing-box

          CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang

          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          export CC=${CC}

          go build -v -trimpath \
            -tags "$TAGS" \
            -ldflags "-checklinkname=0 -X 'internal/godebug.defaultGODEBUG=multipathtcp=0' -s -w -buildid=" \
            -o sing-boxandroidarm64 \
            ./cmd/sing-box

      - name: Upload files
        uses: actions/upload-artifact@main
        with:
          name: sing-box
          path: |
            sing-box/sing-box-androidarm64
            sing-box/sing-box-linux-arm64-musl

      - name: 删除工作流程运行
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          retain_days: 1
          keep_minimum_runs: 2