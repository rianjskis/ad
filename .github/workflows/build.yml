
name: Update SRS Rule

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget jq tar curl

      - name: Download sing-box (latest stable)
        run: |
          SB_TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name"' | cut -d '"' -f 4)
          SB_VER=${SB_TAG#v}

          echo "Latest version: $SB_TAG"

          wget -qO sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${SB_TAG}/sing-box-${SB_VER}-linux-amd64.tar.gz"

          tar -xzf sing-box.tar.gz
          mv sing-box-${SB_VER}-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box

      # 下载 AWAvenue Ads 规则
      - name: Download AWAvenue Ads rules
        run: |
          wget -qO AWAvenue-Ads-Rule-Singbox.json \
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Singbox.json"

      # 下载 httpdns 规则
      - name: Download httpdns rules
        run: |
          wget -qO httpdns.json \
            "https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/singbox/version2/httpdns.json"

      # 合并 AWAvenue Ads + httpdns
      - name: Merge AWAvenue Ads and httpdns rules
        run: |
          jq -s '
            .[0] as $ads |
            .[1] as $http |
            {
              version: $ads.version,
              rules: (
                ($ads.rules // []) +

                # httpdns domain + domain_suffix
                [
                  $http.rules[]?
                  | select(
                      (.domain != null and .domain != [])
                      or
                      (.domain_suffix != null and .domain_suffix != [])
                    )
                  | with_entries(
                      select(
                        .key == "domain"
                        or
                        .key == "domain_suffix"
                      )
                    )
                ] +

                # httpdns ip_cidr
                [
                  $http.rules[]?
                  | select(.ip_cidr != null and .ip_cidr != [])
                  | { ip_cidr }
                ]
              )
            }
          ' \
          AWAvenue-Ads-Rule-Singbox.json \
          httpdns.json \
          > merged_rules.json

      # 编译合并后的规则
      - name: Compile merged rules to srs
        run: |
          ./sing-box rule-set compile \
            --output AWAvenue-Ads-Rule-Singbox.srs \
            merged_rules.json

      # 生成 cnip v4/v6 nft
      - name: Generate cnip v4/v6 nft
        run: |
          # 下载 Loyalsoldier 中国 IP 地址列表
          wget -qO cn.txt \
            "https://github.com/Loyalsoldier/geoip/raw/refs/heads/release/text/cn.txt"

          # IPv4
          {
            echo "set cnip_v4 {"
            echo "    type ipv4_addr"
            echo "    flags interval"
            echo "    auto-merge"
            echo "    elements = {"

            awk '
              /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+$/ {
                print "        " $0 ","
              }
            ' cn.txt

            echo "    }"
            echo "}"
          } > cnip_v4.nft

          # IPv6
          {
            echo "set cnip_v6 {"
            echo "    type ipv6_addr"
            echo "    flags interval"
            echo "    auto-merge"
            echo "    elements = {"

            awk '
              /:/ {
                print "        " $0 ","
              }
            ' cn.txt

            echo "    }"
            echo "}"
          } > cnip_v6.nft

          # 显示生成结果
          echo "===== cnip_v4.nft ====="
          head -n 10 cnip_v4.nft
          echo "..."
          echo "IPv4 entries: $(grep -cE '^[[:space:]]+[0-9]+\.' cnip_v4.nft)"

          echo "===== cnip_v6.nft ====="
          head -n 10 cnip_v6.nft
          echo "..."
          echo "IPv6 entries: $(grep -cE '^[[:space:]]+[0-9a-fA-F]*:' cnip_v6.nft)"

      # 提交更新
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 删除旧的 httpdns 拆分文件
          git rm -f --ignore-unmatch \
            httpdns_domain.srs \
            httpdns_ip.srs

          # 提交最新规则
          git add \
            AWAvenue-Ads-Rule-Singbox.srs \
            cnip_v4.nft \
            cnip_v6.nft

          git commit -m "Update rules $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"

          git push

      - name: 删除工作流程运行
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          retain_days: 5
          keep_minimum_runs: 5
