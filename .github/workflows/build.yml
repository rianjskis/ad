
name: Update SRS Rule

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget jq tar curl

      # Download latest stable sing-box
      - name: Download sing-box (latest stable)
        run: |
          SB_TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name"' | cut -d '"' -f 4)
          SB_VER=${SB_TAG#v}

          echo "Latest version: $SB_TAG"

          wget -qO sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${SB_TAG}/sing-box-${SB_VER}-linux-amd64.tar.gz"

          tar -xzf sing-box.tar.gz
          mv sing-box-${SB_VER}-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box

      # Download original rule
      - name: Download latest rule json
        run: |
          wget -qO AWAvenue-Ads-Rule-Singbox.json \
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Singbox.json"

      # Convert JSON to SRS
      - name: Convert json to srs
        run: |
          ./sing-box rule-set compile \
            --output AWAvenue-Ads-Rule-Singbox.srs \
            AWAvenue-Ads-Rule-Singbox.json

      # Download and convert HTTPDNS rules
      - name: Download and convert httpdns rules
        run: |
          wget -qO httpdns.json \
            "https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/singbox/version2/httpdns.json"

          ./sing-box rule-set compile \
            --output httpdns.srs \
            httpdns.json

      # Generate CNIP IPv4/IPv6 nft sets
      - name: Generate cnip v4/v6 nft
        run: |
          # Download Loyalsoldier China IP list
          wget -qO cn.txt \
            "https://github.com/Loyalsoldier/geoip/raw/refs/heads/release/text/cn.txt"

          # IPv4
          {
            echo "set cnip_v4 {"
            echo "    type ipv4_addr"
            echo "    flags interval"
            echo "    auto-merge"
            echo "    elements = {"

            awk '
              /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+$/ {
                print "        " $0 ","
              }
            ' cn.txt

            echo "    }"
            echo "}"
          } > cnip_v4.nft

          # IPv6
          {
            echo "set cnip_v6 {"
            echo "    type ipv6_addr"
            echo "    flags interval"
            echo "    auto-merge"
            echo "    elements = {"

            awk '
              /:/ {
                print "        " $0 ","
              }
            ' cn.txt

            echo "    }"
            echo "}"
          } > cnip_v6.nft

          # Display generated results
          echo "===== cnip_v4.nft ====="
          head -n 10 cnip_v4.nft
          echo "..."
          echo "IPv4 entries: $(grep -cE '^[[:space:]]+[0-9]+\.' cnip_v4.nft)"

          echo "===== cnip_v6.nft ====="
          head -n 10 cnip_v6.nft
          echo "..."
          echo "IPv6 entries: $(grep -cE '^[[:space:]]+[0-9a-fA-F]*:' cnip_v6.nft)"

      # Commit and push updates
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            AWAvenue-Ads-Rule-Singbox.srs \
            httpdns.srs \
            cnip_v4.nft \
            cnip_v6.nft

          git commit -m "Update rules $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"

          git push

      # Delete old workflow runs
      - name: 删除工作流程运行
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          retain_days: 5
          keep_minimum_runs: 5
