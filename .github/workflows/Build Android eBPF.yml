name: Build Android eBPF

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target.goarch }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target:
          - goarch: arm64
            compiler: aarch64-linux-android35-clang

    env:
      BASE_TAGS: with_quic,with_dhcp,with_utls,with_clash_api,with_ebpf,badlinkname,tfogo_checklinkname0

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.8

      - name: Git clone
        run: |
          git clone -b ebpf-inbound --single-branch https://github.com/CHIZI-0618/sing-box

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.compiler }}

        run: |
          cd sing-box
          export TAGS="$BASE_TAGS"
          make build
      - name: Clone cronet-go
        run: |
          git clone --recursive --depth=1 https://github.com/SagerNet/cronet-go.git

      - name: Prepare cronet-go toolchain (linux arm64 musl)
        run: |
          set -euo pipefail
          cd cronet-go

          go run ./cmd/build-naive \
            --target=linux/arm64 \
            --libc=musl \
            download-toolchain

          go run ./cmd/build-naive \
            --target=linux/arm64 \
            --libc=musl \
            env >> "$GITHUB_ENV"

      - name: Build sing-box (linux arm64 musl naive)
        run: |
          set -euo pipefail
          cd sing-box

          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=arm64

          TAGS="with_quic with_utls with_clash_api with_gvisor with_naive_outbound with_musl badlinkname tfogo_checklinkname0"

          go build -v -trimpath \
            -tags "$TAGS" \
            -ldflags "-checklinkname=0 -X 'internal/godebug.defaultGODEBUG=multipathtcp=0' -s -w -buildid=" \
            -o sing-box-linux-arm64-musl \
            ./cmd/sing-box
            
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-android-${{ matrix.target.goarch }}-with-ebpf
          path: |
            sing-box/sing-box-androidarm64
            sing-box/sing-box-linux-arm64-musl
