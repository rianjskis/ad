name: Build Android eBPF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TAGS: with_quic with_dhcp with_utls with_acme with_clash_api with_gvisor with_ebpf badlinkname tfogo_checklinkname0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.12

      - name: Git clone
        run: |
          git clone -b testing-ref1nd --single-branch https://github.com/CHIZI-0618/sing-box
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build
        working-directory: sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: arm64
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
          BPF_CLANG: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
        run: |
          make build

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-android-arm64-with-ebpf
          path: sing-box
